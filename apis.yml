aid: bmo
url: https://raw.githubusercontent.com/api-evangelist/bmo/refs/heads/main/apis.yml
name: BMO
kind: company
description: >-
  BMO Bank N.A. is the U.S. banking subsidiary of Canada's Bank of Montreal (BMO
  Financial Group), a nationally chartered commercial bank supervised by the
  Office of the Comptroller of the Currency and headquartered in Chicago,
  Illinois. Operating roughly 1,000 branches across 22 states following its 2023
  acquisition of Bank of the West, BMO is a super-regional bank serving personal,
  commercial, and capital-markets customers. Unlike UK or Australian banks, BMO
  is under no U.S. open-banking mandate, but it runs a genuine first-party
  commercial developer portal (developer.bmo.com) for its Online Banking for
  Business / Treasury and Payment Solutions customers, publishing downloadable
  OpenAPI 3.0 and Swagger 2.0 specifications for account validation, payments
  (ACH, wire, EFT, Interac), account information, image retrieval, and OAuth
  authorization on an IBM API Connect platform with FAPI-aligned headers.
