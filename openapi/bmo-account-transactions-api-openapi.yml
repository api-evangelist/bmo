      title: SecurityType
      type: string
      enum:
      - BOND
      - DEBT
      - MUTUALFUND
      - OPTION
      - OTHER
      - STOCK
      - SWEEP
    LoanTransaction:
      title: LoanTransaction Entity
      allOf:
      - $ref: '#/components/schemas/Transaction'
      - type: object
        properties:
          transactionType:
            $ref: '#/components/schemas/LoanTransactionType'
          paymentDetails:
            $ref: '#/components/schemas/PaymentDetails'
    PageMetadata:
      type: object
      properties:
        nextOffset:
          type: string
          description: Opaque identified. Does not need to be numeric or have any specific pattern. Implementation specific.
          example: '2'
        prevOffset:
          type: string
          description: Opaque identified. Does not need to be numeric or have any specific pattern. Implementation specific.
          example: '2'
        totalElements:
          type: integer
          description: Total number of elements
          example: 3
    TransactionReason:
      title: TransactionReason
      type: string
      description: Reason for this transaction; CALL (the debt was called), SELL (the debt was sold), MATURITY (the debt reached maturity)
      enum:
      - CALL
      - MATURITY
      - SELL
    Transaction:
      title: Transaction
      type: object
      required:
      - accountId
      - transactionId
      - postedTimestamp
      - description
      - debitCreditMemo
      - amount
      - transactionTimestamp
      - fiAttributes
      properties:
        accountId:
          maxLength: 256
          type: string
          description: Corresponds to AccountId in Account
        transactionId:
          maxLength: 256
          type: string
          description: Long term persistent identity of the transaction (unique to account)
        referenceTransactionId:
          maxLength: 256
          type: string
          description: For reverse postings, the identity of the transaction being reversed. For the correction transaction, the identity of the reversing post. For credit card posting transactions, the identity of the authorization transaction.
        postedTimestamp:
          type: string
          description: The date and time that the transaction was posted to the account. If not provided then TransactionTimestamp can be used as PostedTimeStamp. YYYY-MM-DD HH-MM-SS.S
        transactionTimestamp:
          type: string
          description: The date and time that the transaction was added to the server backend systems. YYYY-MM-DD HH-MM-SS.S
        description:
          type: string
          description: The description of the transaction
          maxLength: 256
        debitCreditMemo:
          $ref: '#/components/schemas/DebitCreditMemo'
        category:
          type: string
          description: Transaction category, preferably MCC or SIC.
        status:
          $ref: '#/components/schemas/TransactionStatus'
        amount:
          type: string
          description: The amount of money in the account currency
        fiAttributes:
          type: array
          description: Array of FI-specific attributes
          items:
            $ref: '#/components/schemas/FiAttribute'
        links:
          type: object
          properties:
