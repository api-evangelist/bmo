          maxLength: 256
          type: string
          description: BAI code information for the transaction
        BAIName:
          maxLength: 256
          type: string
          description: BAI name related to the transaction
        bankRefNo:
          maxLength: 256
          type: string
          description: Bank reference number
        custRefNo:
          maxLength: 256
          type: string
          description: Customer reference number
        fundType:
          maxLength: 256
          type: string
          description: Fund type corresponding to the transaction
        text:
          type: string
          description: Complete transaction information description (Un-truncated)
